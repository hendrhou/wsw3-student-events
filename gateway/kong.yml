# Kong declarative config (DB-less mode) — single entry point for all services (R1).
# Route table mirrors the frontend API contract (frontend/packages/api/src/endpoints.ts).
# Services receive the full /api/... path (strip_path: false).
_format_version: "3.0"
_transform: true

# Browser origins (:3000 shell, :5001–5004 standalone MFEs, plus the friendly
# .localhost hostnames) call the gateway cross-origin — CORS must be answered
# by Kong even when an upstream is down.
plugins:
  - name: cors
    config:
      # Explicit origins — wildcard is invalid together with credentials
      origins:
        - "http://localhost:3000"
        - "http://localhost:5001"
        - "http://localhost:5002"
        - "http://localhost:5003"
        - "http://localhost:5004"
        - "http://student.localhost"
        - "http://organiser.localhost"
      methods: [GET, POST, PATCH, DELETE, OPTIONS]
      headers: [Accept, Authorization, Content-Type]
      credentials: true
      max_age: 3600

services:
  # Frontend: the gateway is the single entry point — "/" proxies the shell
  # (least-specific route; /api/* always wins). http://localhost/ serves
  # the full app (Kong publishes on port 80 by default).
  - name: shell
    url: http://shell:80
    routes:
      - name: spa
        paths: ["/"]
      # Friendly hostnames (*.localhost resolves to loopback natively on
      # macOS/Linux — no DNS server needed). The shell picks the landing area
      # from the hostname.
      - name: student-area
        hosts: ["student.localhost"]
        paths: ["/"]
        strip_path: false
      - name: organiser-area
        hosts: ["organiser.localhost"]
        paths: ["/"]
        strip_path: false

  - name: user-service
    url: http://user-service:8080
    routes:
      - name: auth
        paths: ["/api/auth"]
        strip_path: false
      - name: profile
        paths: ["/api/profile"]
        strip_path: false
      - name: admin
        paths: ["/api/admin"]
        strip_path: false

  - name: event-service
    url: http://event-service:8080
    routes:
      - name: events
        paths: ["/api/events"]
        strip_path: false
      - name: organiser-events
        paths: ["/api/organiser/events"]
        strip_path: false
        methods: [GET, POST, PATCH]

  - name: registration-service
    url: http://registration-service:8080
    routes:
      # Regex routes take precedence over prefix routes (Kong traditional router).
      - name: register
        paths: ["~/api/events/[^/]+/register$"]
        methods: [POST]
        strip_path: false
      - name: registrations
        paths: ["~/api/organiser/events/[^/]+/registrations$"]
        strip_path: false
      - name: check-in
        paths: ["~/api/organiser/events/[^/]+/check-in$"]
        strip_path: false
        methods: [POST]
      - name: export
        paths: ["~/api/organiser/events/[^/]+/export.csv$"]
        strip_path: false

  - name: semantic-service
    url: http://semantic-service:8080
    routes:
      - name: recommendations
        paths: ["/api/recommendations"]
        strip_path: false
      - name: ontology
        paths: ["/api/ontology"]
        strip_path: false

  - name: ticket-service
    url: http://ticket-service:8080
    routes:
      - name: tickets
        paths: ["/api/tickets"]
        strip_path: false

  # Observability UI, reachable through the gateway by hostname only.
  - name: grafana
    url: http://grafana:3000
    routes:
      - name: grafana
        hosts: ["grafana.localhost"]
        paths: ["/"]
        strip_path: false
