# Kong declarative config (DB-less mode) — single entry point for all services (R1).
# Route table mirrors the frontend API contract (frontend/packages/api/src/endpoints.ts).
# Services receive the full /api/... path (strip_path: false).
_format_version: "3.0"
_transform: true

# Browser origins (:3000 shell, :5001/:5002 standalone MFEs) call the gateway
# cross-origin — CORS must be answered by Kong even when an upstream is down.
plugins:
  - name: cors
    config:
      # Explicit origins — wildcard is invalid together with credentials
      origins:
        - "http://localhost:3000"
        - "http://localhost:5001"
        - "http://localhost:5002"
      methods: [GET, POST, PATCH, DELETE, OPTIONS]
      headers: [Accept, Authorization, Content-Type]
      credentials: true
      max_age: 3600

services:
  # Frontend: the gateway is the single entry point — "/" proxies the shell
  # (least-specific route; /api/* always wins). http://localhost:8000/ serves
  # the full app.
  - name: shell
    url: http://shell:80
    routes:
      - name: spa
        paths: ["/"]

  - name: user-service
    url: http://user-service:8080
    routes:
      - name: auth
        paths: ["/api/auth"]
      - name: profile
        paths: ["/api/profile"]

  - name: event-service
    url: http://event-service:8080
    routes:
      - name: events
        paths: ["/api/events"]
      - name: organiser-events
        paths: ["/api/organiser/events"]
        methods: [GET, POST, PATCH]

  - name: registration-service
    url: http://registration-service:8080
    routes:
      # Regex routes take precedence over the organiser-events prefix route.
      - name: registrations
        paths: ["~/api/organiser/events/[^/]+/registrations$"]
      - name: check-in
        paths: ["~/api/organiser/events/[^/]+/check-in$"]
        methods: [POST]
      - name: export
        paths: ["~/api/organiser/events/[^/]+/export.csv$"]

  - name: semantic-service
    url: http://semantic-service:8080
    routes:
      - name: recommendations
        paths: ["/api/recommendations"]
      - name: ontology
        paths: ["/api/ontology"]

  - name: ticket-service
    url: http://ticket-service:8080
    routes:
      - name: tickets
        paths: ["/api/tickets"]
