name: Observability

on:
  pull_request:
    paths:
      - observability/**
      - services/**
      - frontend/**
      - gateway/**
      - docker-compose.yml
      - .github/workflows/observability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare local-only Grafana credentials
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "GRAFANA_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Go telemetry tests and coverage gate
        working-directory: services
        run: |
          go test -race -coverprofile="$RUNNER_TEMP/telemetry.cover" ./shared/telemetry
          go tool cover -func="$RUNNER_TEMP/telemetry.cover" | awk '/^total:/ {gsub(/%/, "", $3); if ($3 < 80) exit 1}'
      - name: Browser telemetry tests and coverage gate
        working-directory: frontend
        run: |
          corepack enable && corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @campus-pulse/telemetry test
      - name: Check generated dashboards
        run: node --test observability/dashboards.test.mjs
      - name: Validate configurations and alert rules
        run: |
          docker compose --profile backend config -q
          docker run --rm -v "$PWD/observability:/etc/alloy:ro" grafana/alloy:v1.11.0 validate /etc/alloy/alloy.alloy
          docker run --rm --entrypoint promtool -v "$PWD/observability:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -w /etc/prometheus/rules -v "$PWD/observability:/etc/prometheus:ro" prom/prometheus:v3.5.0 test rules services.test.yml
          docker run --rm -e KONG_DATABASE=off -v "$PWD/gateway/kong.yml:/config/kong.yml:ro" kong:3.9 kong config parse /config/kong.yml > /dev/null
      - name: Start full stack
        run: docker compose --profile backend up -d --build --wait --wait-timeout 180
      - name: Live ingestion, correlation, dashboard queries and distributed registration trace
        env:
          SMOKE_WRITE_TESTS: "true"
        run: node --test observability/smoke.test.mjs
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose --profile backend ps && docker compose --profile backend logs --tail=80
      - name: Stop isolated CI stack
        if: always()
        run: docker compose --profile backend down -v