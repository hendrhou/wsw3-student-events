global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/services.yml

scrape_configs:
  - job_name: campus-services
    static_configs:
      - targets: [user-service:9090, event-service:9090, registration-service:9090, semantic-service:9090, ticket-service:9090]
        labels:
          environment: local
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):9090'
        target_label: service_name
        replacement: '$1'
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: kong
    static_configs:
      - targets: [kong:8100]