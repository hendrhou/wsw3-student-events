name: campus-pulse

# Single orchestration file for the whole distributed system (R3).
# One documented start-up command: `docker compose up --build` starts
# EVERYTHING — frontend, gateway, Go services, Postgres, MinIO, Fuseki — and
# plain `docker compose down` tears it all down. No profiles, no flags.

# Telemetry defaults for every Go service (OTLP via Alloy; see observability/).
x-telemetry: &telemetry
  APP_ENV: ${APP_ENV:-local}
  APP_VERSION: ${APP_VERSION:-dev}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# Container logs to Alloy (syslog) then Loki. Short IDs keep RFC5424 MSGID <= 32.
x-logging: &logging
  driver: syslog
  options:
    syslog-address: udp://127.0.0.1:${SYSLOG_PORT:-1514}
    syslog-format: rfc5424
    tag: '{{.ID}}'

services:
  # ---------- Frontend (React MFEs, Module Federation) ----------
  shell:
    logging: *logging
    build:
      context: ./frontend
      dockerfile: shell/Dockerfile
      args:
        VITE_EVENTS_MFE_URL: http://localhost:${EVENTS_MFE_PORT:-5001}
        VITE_PARTICIPATION_MFE_URL: http://localhost:${PARTICIPATION_MFE_PORT:-5002}
        VITE_CREDENTIALS_MFE_URL: http://localhost:${CREDENTIALS_MFE_PORT:-5003}
        VITE_PEOPLE_MFE_URL: http://localhost:${PEOPLE_MFE_PORT:-5004}
        VITE_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost/api}
        VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-true}
        VITE_APP_VERSION: ${APP_VERSION:-dev}
        # Containers default to the real backend through Kong; set
        # VITE_USE_MSW=true in .env to run the frontend against MSW mocks.
        VITE_USE_MSW: ${VITE_USE_MSW:-false}
    ports:
      - "${SHELL_PORT:-3000}:80"
    depends_on:
      - events-mfe
      - participation-mfe
      - credentials-mfe
      - people-mfe

  events-mfe:
    logging: *logging
    build:
      context: ./frontend
      dockerfile: events-mfe/Dockerfile
      args:
        VITE_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost/api}
        VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-true}
        VITE_APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${EVENTS_MFE_PORT:-5001}:80"

  participation-mfe:
    logging: *logging
    build:
      context: ./frontend
      dockerfile: participation-mfe/Dockerfile
      args:
        VITE_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost/api}
        VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-true}
        VITE_APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${PARTICIPATION_MFE_PORT:-5002}:80"

  credentials-mfe:
    logging: *logging
    build:
      context: ./frontend
      dockerfile: credentials-mfe/Dockerfile
      args:
        VITE_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost/api}
        VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-true}
        VITE_APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${CREDENTIALS_MFE_PORT:-5003}:80"

  people-mfe:
    logging: *logging
    build:
      context: ./frontend
      dockerfile: people-mfe/Dockerfile
      args:
        VITE_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost/api}
        VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-true}
        VITE_APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${PEOPLE_MFE_PORT:-5004}:80"

  # ---------- API gateway (Kong, DB-less declarative mode) ----------
  kong:
    logging: *logging
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_LOG_LEVEL: info
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_DNS_VALID_TTL: "5"
      KONG_DNS_STALE_TTL: "1"
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: ${OTEL_TRACES_SAMPLER_ARG:-1}
      KONG_PROXY_ACCESS_LOG: "off"
      KONG_ADMIN_ACCESS_LOG: "off"
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    # Host port 80 by default → port-free URLs (http://student.localhost/…).
    # Override KONG_PORT if 80 is taken; PUBLIC_GATEWAY_URL must match.
    ports:
      - "${KONG_PORT:-80}:8000"

  # ---------- Backend (Go/Gin services, each with its own persistence, R1) ----------
  user-service:
    logging: *logging
    build:
      context: ./services
      dockerfile: user-service/Dockerfile
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://campus_pulse:campus_pulse@postgres:5432/users
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      FRONTEND_URL: http://localhost:${SHELL_PORT:-3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${PUBLIC_GATEWAY_URL:-http://localhost/api}/auth/google/callback
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-true}
      # Comma-separated emails promoted to admin at startup (demo default: Olga).
      # Admins manage organisers from the Team screen; admins are env-managed.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-olga@ufp.edu.pt}
      SEMANTIC_SERVICE_URL: http://semantic-service:8080
    depends_on:
      postgres:
        condition: service_healthy

  event-service:
    logging: *logging
    build:
      context: ./services
      dockerfile: event-service/Dockerfile
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://campus_pulse:campus_pulse@postgres:5432/events
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      SEMANTIC_SERVICE_URL: http://semantic-service:8080
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-campus-pulse}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dev-minio-change-me}
      MINIO_BUCKET: event-covers
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  registration-service:
    logging: *logging
    build:
      context: ./services
      dockerfile: registration-service/Dockerfile
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://campus_pulse:campus_pulse@postgres:5432/registrations
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      EVENT_SERVICE_URL: http://event-service:8080
      TICKET_SERVICE_URL: http://ticket-service:8080
    depends_on:
      postgres:
        condition: service_healthy

  semantic-service:
    logging: *logging
    build:
      context: ./services
      dockerfile: semantic-service/Dockerfile
    environment:
      <<: *telemetry
      SPARQL_ENDPOINT: http://fuseki:3030/campus-pulse/sparql
      SPARQL_UPDATE_ENDPOINT: http://fuseki:3030/campus-pulse/update
      FUSEKI_USER: admin
      FUSEKI_PASSWORD: campus_pulse
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      EVENT_SERVICE_URL: http://event-service:8080
    depends_on:
      - fuseki

  ticket-service:
    logging: *logging
    build:
      context: ./services
      dockerfile: ticket-service/Dockerfile
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://campus_pulse:campus_pulse@postgres:5432/tickets
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      REGISTRATION_SERVICE_URL: http://registration-service:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- Persistence (one PostgreSQL instance, one database per service) ----------
  minio:
    logging: *logging
    build:
      context: ./services/minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-campus-pulse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-change-me}
    # No host ports: event-service uploads/reads covers in-network; browsers get
    # images via Kong → event-service /api/events/:id/cover.
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    logging: *logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus_pulse
      POSTGRES_PASSWORD: campus_pulse
      POSTGRES_DB: users
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_pulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # RDF triple store for the semantic layer. Internal-only: SPARQL reaches it
  # via semantic-service (R8's API boundary), never from the host.
  fuseki:
    logging: *logging
    image: stain/jena-fuseki:5.1.0
    environment:
      ADMIN_PASSWORD: campus_pulse

  # ---------- Observability UI ----------
  # Exposed ONLY through Kong: http://grafana.localhost (host route).
  # No host port — like the backends, Grafana is internal to the compose network.
  grafana:
    logging: *logging
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_METRICS_ENABLED: "true"
      # Public URL is the Kong host route so login redirects and assets resolve.
      GF_SERVER_ROOT_URL: ${PUBLIC_GRAFANA_URL:-http://grafana.localhost}/
    volumes:
      # Datasources and dashboards are provisioned as code (observability/).
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    restart: unless-stopped

  # ---------- Observability stack (config as code in observability/) ----------
  # Alloy receives container logs (syslog) and OTLP telemetry from services and
  # Kong; Prometheus/Loki/Tempo store them; Grafana queries them. Only Alloy's
  # syslog input and Prometheus' debug UI bind localhost; everything else stays
  # internal to the compose network (Grafana is the Kong-routed front-end).
  alloy:
    image: grafana/alloy:v1.11.0
    command: [run, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    ports:
      - "127.0.0.1:${SYSLOG_PORT:-1514}:1514/udp"
    mem_limit: 512m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=1GB, --web.enable-remote-write-receiver]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    mem_limit: 512m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.5
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    mem_limit: 512m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    command: [-config.file=/etc/tempo/config.yml]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    mem_limit: 512m
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  grafana-data:
  alloy-data:
  prometheus-data:
  loki-data:
  tempo-data:
