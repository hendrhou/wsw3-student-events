name: campus-pulse

x-telemetry: &telemetry
  APP_ENV: ${APP_ENV:-local}
  APP_VERSION: ${APP_VERSION:-dev}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-logging: &logging
  driver: syslog
  options:
    syslog-address: udp://127.0.0.1:${SYSLOG_PORT:-1514}
    syslog-format: rfc5424
    tag: '{{.ID}}'
    mode: non-blocking
    max-buffer-size: 4m

# Single orchestration file for the whole distributed system (R3).
# One documented start-up command: `docker compose up --build`.
#
# Today: frontend (shell + 2 MFEs) and Kong (declarative config) start by
# default. Backend services and their databases are profile-gated behind
# `--profile backend` until each Go/Gin service lands — their build contexts
# (services/*) are created in later phases.

services:
  # ---------- Frontend (React MFEs, Module Federation) ----------
  shell:
    logging: *logging
    build:
      context: ./frontend
      dockerfile: shell/Dockerfile
      args:
        VITE_STUDENT_MFE_URL: http://localhost:${STUDENT_MFE_PORT:-5001}
        VITE_ORGANISER_MFE_URL: http://localhost:${ORGANISER_MFE_PORT:-5002}
        VITE_GATEWAY_URL: http://localhost:${KONG_PORT:-8000}/api
        VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-true}
        VITE_APP_VERSION: ${APP_VERSION:-dev}
        # Containers default to the real backend through Kong; set
        # VITE_USE_MSW=true in .env to run the frontend against MSW mocks.
        VITE_USE_MSW: ${VITE_USE_MSW:-false}
    ports:
      - "${SHELL_PORT:-3000}:80"
    depends_on:
      - student-mfe
      - organiser-mfe

  student-mfe:
    logging: *logging
    build:
      context: ./frontend
      dockerfile: student-mfe/Dockerfile
      args:
        VITE_GATEWAY_URL: http://localhost:${KONG_PORT:-8000}/api
        VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-true}
        VITE_APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${STUDENT_MFE_PORT:-5001}:80"

  organiser-mfe:
    logging: *logging
    build:
      context: ./frontend
      dockerfile: organiser-mfe/Dockerfile
      args:
        VITE_GATEWAY_URL: http://localhost:${KONG_PORT:-8000}/api
        VITE_TELEMETRY_ENABLED: ${VITE_TELEMETRY_ENABLED:-true}
        VITE_APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${ORGANISER_MFE_PORT:-5002}:80"

  # ---------- API gateway (Kong, DB-less declarative mode) ----------
  kong:
    logging: *logging
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_LOG_LEVEL: info
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_DNS_VALID_TTL: "5"
      KONG_DNS_STALE_TTL: "1"
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: ${OTEL_TRACES_SAMPLER_ARG:-1}
      KONG_PROXY_ACCESS_LOG: "off"
      KONG_ADMIN_ACCESS_LOG: "off"
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    ports:
      - "${KONG_PORT:-8000}:8000"
    # Upstreams 503 until the backend profile services are running — expected.

  # ---------- Backend (profile-gated until each service lands) ----------
  # Each Go/Gin service has its own persistence (R1). Build contexts are
  # created when the services are implemented.
  user-service:
    logging: *logging
    profiles: ["backend"]
    build:
      context: ./services
      dockerfile: user-service/Dockerfile
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://campus_pulse:campus_pulse@user-db:5432/users
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      FRONTEND_URL: http://localhost:${SHELL_PORT:-3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: http://localhost:${KONG_PORT:-8000}/api/auth/google/callback
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-true}
      # Comma-separated emails promoted to admin at startup (demo default: Olga).
      # Admins manage organisers from the Team screen; admins are env-managed.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-olga@ufp.edu.pt}
      SEMANTIC_SERVICE_URL: http://semantic-service:8080
    depends_on:
      user-db:
        condition: service_healthy

  event-service:
    logging: *logging
    profiles: ["backend"]
    build:
      context: ./services
      dockerfile: event-service/Dockerfile
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://campus_pulse:campus_pulse@event-db:5432/events
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      SEMANTIC_SERVICE_URL: http://semantic-service:8080
    depends_on:
      event-db:
        condition: service_healthy

  registration-service:
    logging: *logging
    profiles: ["backend"]
    build:
      context: ./services
      dockerfile: registration-service/Dockerfile
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://campus_pulse:campus_pulse@registration-db:5432/registrations
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      EVENT_SERVICE_URL: http://event-service:8080
      TICKET_SERVICE_URL: http://ticket-service:8080
    depends_on:
      registration-db:
        condition: service_healthy

  semantic-service:
    logging: *logging
    profiles: ["backend"]
    build:
      context: ./services
      dockerfile: semantic-service/Dockerfile
    environment:
      <<: *telemetry
      SPARQL_ENDPOINT: http://fuseki:3030/campus-pulse/sparql
      SPARQL_UPDATE_ENDPOINT: http://fuseki:3030/campus-pulse/update
      FUSEKI_USER: admin
      FUSEKI_PASSWORD: campus_pulse
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      EVENT_SERVICE_URL: http://event-service:8080
    depends_on:
      - fuseki

  ticket-service:
    logging: *logging
    profiles: ["backend"]
    build:
      context: ./services
      dockerfile: ticket-service/Dockerfile
    environment:
      <<: *telemetry
      DATABASE_URL: postgres://campus_pulse:campus_pulse@ticket-db:5432/tickets
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      REGISTRATION_SERVICE_URL: http://registration-service:8080
      PUBLIC_BASE_URL: http://localhost:${KONG_PORT:-8000}
    depends_on:
      ticket-db:
        condition: service_healthy

  # ---------- Persistence (one store per service) ----------
  user-db: &postgres
    profiles: ["backend"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus_pulse
      POSTGRES_PASSWORD: campus_pulse
      POSTGRES_DB: users
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_pulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  event-db:
    <<: *postgres
    environment:
      POSTGRES_USER: campus_pulse
      POSTGRES_PASSWORD: campus_pulse
      POSTGRES_DB: events

  registration-db:
    <<: *postgres
    environment:
      POSTGRES_USER: campus_pulse
      POSTGRES_PASSWORD: campus_pulse
      POSTGRES_DB: registrations

  ticket-db:
    <<: *postgres
    environment:
      POSTGRES_USER: campus_pulse
      POSTGRES_PASSWORD: campus_pulse
      POSTGRES_DB: tickets

  # RDF triple store for the semantic layer (SPARQL endpoint)
  fuseki:
    profiles: ["backend"]
    image: stain/jena-fuseki:5.1.0
    environment:
      ADMIN_PASSWORD: campus_pulse
    ports:
      - "${FUSEKI_PORT:-3030}:3030"

  alloy:
    image: grafana/alloy:v1.11.0
    command: [run, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    ports:
      - "127.0.0.1:${SYSLOG_PORT:-1514}:1514/udp"
    mem_limit: 512m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=1GB, --web.enable-remote-write-receiver]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    mem_limit: 512m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.5
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    mem_limit: 512m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    command: [-config.file=/etc/tempo/config.yml]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your local .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_METRICS_ENABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    mem_limit: 256m
    restart: unless-stopped

volumes:
  alloy-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
