# MFE remotes: SPA fallback + permissive CORS so the shell origin can fetch
# remoteEntry.js and chunks cross-origin.
log_format telemetry escape=json '{"service_name":"mfe-nginx","level":"INFO","msg":"request","method":"$request_method","status":$status,"latency_seconds":$request_time}';
access_log /var/log/nginx/access.log telemetry;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header Access-Control-Allow-Origin * always;
    try_files $uri $uri/ /index.html;
  }

  location = /remoteEntry.js {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "no-store";
  }
}
