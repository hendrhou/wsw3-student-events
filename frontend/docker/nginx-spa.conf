# Shell: SPA fallback, no CORS (it is the top-level origin).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Federation host entry must never be cached stale
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
